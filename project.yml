name: Nomad
options:
  bundleIdPrefix: com.nomadai
  deploymentTarget:
    iOS: "15.0"
targets:
  Nomad:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Sources
      - Resources
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nomadai.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    preBuildScripts:
      - name: Compile Assets
        script: |
          echo "Assets included"
