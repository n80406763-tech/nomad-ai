name: Build Unsigned IPA — Nomad AI

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Выбрать Xcode 15.4
      run: |
        sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
        xcodebuild -version

    - name: Установить XcodeGen
      run: brew install xcodegen

    - name: Сгенерировать .xcodeproj
      run: xcodegen generate --spec project.yml

    - name: Сборка без подписи
      run: |
        set -o pipefail
        xcodebuild clean build \
          -project Nomad.xcodeproj \
          -scheme Nomad \
          -configuration Release \
          -sdk iphoneos \
          -destination "generic/platform=iOS" \
          -derivedDataPath DerivedData \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          PROVISIONING_PROFILE_SPECIFIER="" \
          OTHER_CODE_SIGN_FLAGS="--deep"

    - name: Упаковать в .ipa
      run: |
        APP_PATH=$(find DerivedData -name "*.app" -not -path "*.dSYM*" | head -n 1)
        echo "Найдено: $APP_PATH"
        if [ -z "$APP_PATH" ]; then
          echo "ERROR: .app не найден"
          find DerivedData -type d | head -30
          exit 1
        fi
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        zip -r Nomad.ipa Payload
        ls -lh Nomad.ipa

    - name: Загрузить IPA
      uses: actions/upload-artifact@v4
      with:
        name: Nomad-AI.ipa
        path: Nomad.ipa
        retention-days: 14
