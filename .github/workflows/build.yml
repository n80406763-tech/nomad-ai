name: Build Unsigned IPA — Nomad AI

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Показать версию Xcode
        run: xcodebuild -version

      - name: Установить XcodeGen
        run: brew install xcodegen

      - name: Собрать офлайн карту России OSM
        run: |
          set -euo pipefail
          PMTILES_VERSION="1.31.2"
          if [ "$(uname -m)" = "arm64" ]; then
            PMTILES_ARCH="Darwin_arm64"
          else
            PMTILES_ARCH="Darwin_x86_64"
          fi
          TMP_DIR="$(mktemp -d)"
          curl --fail --location \
            "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/go-pmtiles-${PMTILES_VERSION}_${PMTILES_ARCH}.zip" \
            --output "${TMP_DIR}/pmtiles.zip"
          unzip -q "${TMP_DIR}/pmtiles.zip" -d "${TMP_DIR}/pmtiles"
          "${TMP_DIR}/pmtiles/pmtiles" extract \
            "https://build.protomaps.com/20260821.pmtiles" \
            "Resources/VectorMap/russia.pmtiles" \
            --region="Resources/VectorMap/russia.geojson" \
            --maxzoom=10 \
            --download-threads=6
          ls -lh "Resources/VectorMap/russia.pmtiles"

      - name: Сгенерировать .xcodeproj
        run: xcodegen generate --spec project.yml

      - name: Сборка без подписи
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project Nomad.xcodeproj \
            -scheme Nomad \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Проверить метаданные приложения
        run: |
          set -euo pipefail
          APP_PATH=$(find DerivedData -name "*.app" -not -path "*.dSYM*" | head -n 1)
          INFO_PATH="${APP_PATH}/Info.plist"
          EXPECTED_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Info.plist)
          EXPECTED_SHORT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          test "$EXPECTED_VERSION" = "$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PATH")"
          test "$EXPECTED_SHORT_VERSION" = "$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO_PATH")"
          test "LaunchScreen" = "$(/usr/libexec/PlistBuddy -c "Print :UILaunchStoryboardName" "$INFO_PATH")"
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$INFO_PATH" >/dev/null
          /usr/libexec/PlistBuddy -c "Print :NSLocationAlwaysAndWhenInUseUsageDescription" "$INFO_PATH" >/dev/null

      - name: Упаковать unsigned IPA
        run: |
          APP_PATH=$(find DerivedData -name "*.app" -not -path "*.dSYM*" | head -n 1)
          echo "Найдено: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app не найден"
            exit 1
          fi

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/

          zip -r Nomad.ipa Payload
          ls -lh Nomad.ipa

      - name: Загрузить IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nomad-AI.ipa
          path: Nomad.ipa
          retention-days: 14
          compression-level: 0
