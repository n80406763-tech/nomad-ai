name: Build Unsigned IPA — Nomad AI

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: ''

jobs:
  build:
    runs-on: macos-14   # macOS Sonoma + Xcode 15

    steps:
    - name: Checkout код
      uses: actions/checkout@v4

    - name: Выбрать Xcode 15
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Установить XcodeGen
      run: brew install xcodegen

    - name: Сгенерировать .xcodeproj из project.yml
      run: xcodegen generate --spec project.yml

    - name: Сборка (без подписи — для AltStore)
      run: |
        xcodebuild clean build \
          -project Nomad.xcodeproj \
          -scheme Nomad \
          -configuration Release \
          -sdk iphoneos \
          -destination "generic/platform=iOS" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          PROVISIONING_PROFILE_SPECIFIER="" \
          EXCLUDED_ARCHS="" \
          BUILD_DIR=build \
          | xcpretty --color

    - name: Найти .app и упаковать в .ipa
      run: |
        APP_PATH=$(find build -name "*.app" -not -path "*.dSYM*" | head -n 1)
        echo "Найдено приложение: $APP_PATH"
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        zip -r Nomad.ipa Payload
        ls -lh Nomad.ipa

    - name: Загрузить .ipa как артефакт GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: Nomad-AI-${{ github.sha }}.ipa
        path: Nomad.ipa
        retention-days: 14

    - name: Создать GitHub Release (если указан тег)
      if: ${{ github.event.inputs.release_tag != '' }}
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.release_tag }}
        name: "Nomad AI ${{ github.event.inputs.release_tag }}"
        files: Nomad.ipa
        body: |
          ## Nomad AI — Офлайн Навигатор
          
          Установка через AltStore:
          1. Скачайте Nomad.ipa
          2. Откройте AltStore → My Apps → +
          3. Выберите скачанный файл
          
          ### Что нового
          - Офлайн навигация с GPS
          - Голосовой ИИ-ассистент
          - Поиск заправок и отелей
          - Музыкальный плеер
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
